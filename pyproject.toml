[project]
name = "invoice-agent"
version = "0.0.0"
description = "Agentic system that processes supplier invoices for small French businesses."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "langfuse>=5.0.4",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "opentelemetry-sdk>=1.30",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agent"]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-ra --strict-markers"

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true
