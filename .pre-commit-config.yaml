# Hooks run through `uv run` so they use the versions pinned in uv.lock.
# Install with: uv run pre-commit install --install-hooks
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        stages: [pre-commit]
      - id: conventional-commit
        name: conventional commit message
        entry: uv run python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
